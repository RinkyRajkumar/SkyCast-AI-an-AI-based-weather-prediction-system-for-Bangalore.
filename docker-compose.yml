services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: "8000"
      SKYCAST_CORS_ORIGINS: "${SKYCAST_CORS_ORIGINS:-http://localhost:5173}"
      SKYCAST_CORS_ALLOW_CREDENTIALS: "false"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "backend.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api}"
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
